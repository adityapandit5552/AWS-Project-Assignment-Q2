<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS EC2 Web Server</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 700px;
            padding: 55px;
            text-align: center;

            background: #0d0d0d;
            border: 1px solid #252525;
            border-radius: 18px;

            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;

            border: 1px solid #2b4538;
            border-radius: 20px;

            color: #4bdd8c;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        h1 {
            margin-top: 25px;

            font-size: 48px;
            letter-spacing: -1.5px;
        }

        h1 span {
            color: #ff9900;
        }

        p {
            margin-top: 20px;

            color: #777;
            font-size: 15px;
            line-height: 1.7;
        }

        .server {
            margin-top: 35px;
            padding: 18px;

            background: #111;
            border: 1px solid #222;
            border-radius: 10px;

            color: #aaa;
            font-size: 13px;
        }

        .server strong {
            color: #fff;
        }

        footer {
            margin-top: 30px;

            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            ● EC2 SERVER ONLINE
        </div>

        <h1>
            AWS <span>EC2</span>
        </h1>

        <p>
            This website is hosted on an Ubuntu EC2 instance
            running Apache Web Server inside a custom AWS VPC.
        </p>

        <div class="server">
            <strong>Web Server:</strong> Apache2
            &nbsp; | &nbsp;
            <strong>OS:</strong> Ubuntu
            &nbsp; | &nbsp;
            <strong>Network:</strong> Public Subnet
        </div>

        <footer>
            AWS PROJECT ASSIGNMENT · QUESTION 2 · 2026
        </footer>

    </div>

</body>

</html>
